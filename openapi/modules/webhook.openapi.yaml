  /v1/webhook/test:
    post:
      summary: 测试回调接口
      deprecated: false
      description: "## 回调接口说明\n1. 调用该接口会向 回调配置中 添加的 callback_url 发送一个请求\n1.1 Header 包含一个 X-Signature 校验头， X-Timestamp 时间戳\n\
        1.2 Body格式： {\"message_id\":\"msg_xxx\",\"data\":\"加密内容\"}\n1.3 用户可根据自身需要对 消息内容进行校验，加密方式：HMAC-SHA256 通过Header中X-Timestamp的内容+Body中的data数据，以及创建回调配置时返回的\
        \ 加密串 security_config 进行解密校验\n2. 该接口需要一个正确的响应\n2.1 响应内容需要包含 message_id 这个与后续消息推送的响应一致\n2.2 测试接口需要额外返回biz_data 进行校验\n\
        2.2.1 解密逻辑通过 AES-256-GCM 方式进行解密，最终得到 {\"biz\":[{\"biz_type\":\"xiaoman.open.callback.test\",\"biz_data\":\"xxx\"}]}\
        \ 的数据结构\n2.3 响应体结构 ： {\"code\":200,\"data\":{\"message_id\":\"msg_xxx\",\"data\":\"xxx\"}}\n\nJS 签名校验示例\n```\nconst\
        \ crypto = require('crypto');\n\n// 生成 HMAC-SHA256 签名\nfunction generateHMAC(message, secretKey) {\n    return crypto\n\
        \        .createHmac('sha256', secretKey)\n        .update(message)\n        .digest('hex');\n}\n\n// 验证 HMAC-SHA256\
        \ 签名\nfunction verifyHMAC(message, signature, secretKey) {\n    const generatedSignature = generateHMAC(message, secretKey);\n\
        \    return crypto.timingSafeEqual(\n        Buffer.from(generatedSignature, 'hex'),\n        Buffer.from(signature,\
        \ 'hex')\n    );\n}\n\n// 使用示例\nconst message = '{\"message_id\":\"msg_68d6527b8e41f8.33205216\",\"data\":\"REDACTED_ENCRYPTED_DATA\"\
        }'; // 接口返回的响应内容\nconst secretKey = 'REDACTED_SECURITY_CONFIG'; // 创建webhook 返回的 security_config\nconst signature\
        \ = 'REDACTED_SIGNATURE'; // 响应Header 上的 X-Signature\nconst timestamp = '1758876283'; // 响应 Header 上的 X-Timestamp\n\
        \nconsole.log(timestamp+message);\n// 验证签名\nconst isValid = verifyHMAC(timestamp+message, signature, secretKey);\n\
        console.log('Signature valid:', isValid);\n```\n\nJS 解密示例\n```\nconst crypto = require('crypto');\n\nfunction decryptWithAES256GCM(data,\
        \ key) {\n    try {\n        console.log('=== 解密调试信息 ===');\n        console.log('输入data类型:', typeof data);\n    \
        \    console.log('输入key类型:', typeof key);\n        \n        // 确保输入数据正确\n        let dataBuffer;\n        if (typeof\
        \ data === 'string') {\n            dataBuffer = Buffer.from(data, 'base64');\n        } else {\n            dataBuffer\
        \ = Buffer.isBuffer(data) ? data : Buffer.from(data);\n        }\n        \n        console.log('dataBuffer长度:', dataBuffer.length);\n\
        \        console.log('dataBuffer内容(HEX):', dataBuffer.toString('hex'));\n        \n        // 确保密钥正确处理\n        let\
        \ keyBuffer;\n        if (typeof key === 'string') {\n            keyBuffer = Buffer.from(key, 'base64');\n      \
        \  } else {\n            keyBuffer = Buffer.isBuffer(key) ? key : Buffer.from(key);\n        }\n        \n       \
        \ console.log('keyBuffer长度:', keyBuffer.length);\n        console.log('keyBuffer内容(HEX):', keyBuffer.toString('hex'));\n\
        \        \n        // 验证密钥长度\n        if (keyBuffer.length !== 32) {\n            throw new Error(`密钥长度不正确: ${keyBuffer.length}\
        \ 字节，应为32字节`);\n        }\n        \n        // 检查数据长度\n        if (dataBuffer.length < 28) {\n            throw new\
        \ Error('加密数据太短');\n        }\n        \n        // 提取IV、标签和加密内容\n        const iv = dataBuffer.subarray(0, 12);\n\
        \        const tag = dataBuffer.subarray(12, 28);\n        const encrypted = dataBuffer.subarray(28);\n        \n\
        \        console.log('IV length:', iv.length);\n        console.log('Tag length:', tag.length);\n        console.log('Encrypted\
        \ data length:', encrypted.length);\n        console.log('IV (hex):', iv.toString('hex'));\n        console.log('Tag\
        \ (hex):', tag.toString('hex'));\n        console.log('Encrypted (hex):', encrypted.toString('hex'));\n        \n\
        \        // 验证提取的数据完整性\n        if (iv.length !== 12 || tag.length !== 16) {\n            throw new Error('加密数据格式不正确');\n\
        \        }\n        \n        // 创建解密器\n        const decipher = crypto.createDecipheriv('aes-256-gcm', keyBuffer,\
        \ iv);\n        \n        // 设置认证标签\n        decipher.setAuthTag(tag);\n        \n        // 解密数据\n        let decrypted\
        \ = decipher.update(encrypted, null, 'utf8');\n        console.log('update阶段解密成功');\n        decrypted += decipher.final('utf8');\n\
        \        console.log('final阶段解密成功');\n        \n        return decrypted;\n    } catch (error) {\n        console.error('解密失败详细信息:',\
        \ {\n            message: error.message,\n            stack: error.stack,\n            dataLength: data ? (typeof\
        \ data === 'string' ? Buffer.from(data, 'base64').length : data.length) : 0\n        });\n        throw new Error(`解密失败:\
        \ ${error.message}`);\n    }\n}\n\n// 测试数据\nconst message = '{\"message_id\":\"msg_68d6527b8e41f8.33205216\",\"data\"\
        :\"REDACTED_ENCRYPTED_DATA\"}';\nconst secretKey = 'REDACTED_SECURITY_CONFIG';\n\nconsole.log('原始消息:', message);\n\
        console.log('密钥:', secretKey);\n\n// 解析消息\nconst messageJson = JSON.parse(message);\nconst messageData = messageJson.data;\n\
        \nconsole.log('要解密的data字段:', messageData);\n\ntry {\n    const decryptedData = decryptWithAES256GCM(messageData, secretKey);\n\
        \    console.log('解密成功:', decryptedData);\n    \n    // 尝试解析解密后的JSON\n    try {\n        const parsedData = JSON.parse(decryptedData);\n\
        \        console.log('解析后的JSON:', JSON.stringify(parsedData, null, 2));\n    } catch (parseError) {\n        console.log('解密数据不是有效的JSON格式');\n\
        \        console.log('解密数据内容:', decryptedData);\n    }\n} catch (error) {\n    console.error('解密失败:', error.message);\n\
        \    \n    // 额外的调试信息\n    console.log('\\n=== 额外调试信息 ===');\n    console.log('Base64解码后的数据长度:', Buffer.from(messageData,\
        \ 'base64').length);\n    console.log('Base64数据是否有效:', /^[A-Za-z0-9+/]*={0,2}$/.test(messageData));\n}\n```"
      tags:
      - 消息推送
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  now:
                    type: string
                required:
                - code
                - message
                - now
                x-apifox-orders:
                - code
                - message
                - now
              example:
                code: 200
                message: success
                now: '2025-09-25 12:36:59'
          headers: {}
          x-apifox-name: 成功
      security: []
      x-apifox-folder: 消息推送
      x-apifox-status: released
      operationId: post_v1_webhook_test
      x-local-source-path: sources/pages/api-3497013.md
      x-source-id: api-3497013
      x-source-title: 测试回调接口
      x-source-module: 消息推送
