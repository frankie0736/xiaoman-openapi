openapi: 3.0.1
info:
  title: Xiaoman OpenAPI - 库存 (unofficial)
  version: '2026-05-09'
  description: 'Unofficial module spec generated from public Xiaoman Open API documentation: 库存.'
servers:
- url: https://api-sandbox.xiaoman.cn
  description: official documented server
tags:
- name: 库存
  x-module-slug: warehouse
paths:
  /v1/product/push-inventory:
    post:
      summary: 库存写入
      deprecated: false
      description: 该接口支持同步外部的库存数据到小满，但通过该方式写入的库存只能用于查看，不能用于小满的出库。
      tags:
      - 库存
      parameters:
      - name: Authorization
        in: header
        description: ''
        required: true
        example: REDACTED_JWT
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  sku_id:
                    type: integer
                    title: 产品SKU ID
                  real_count:
                    type: integer
                    title: 实际库存数量
                    description: 非必填。默认为可用库存
                  enable_count:
                    type: integer
                    title: 可用库存数量
                  inventory_type:
                    type: integer
                    description: 修改类型 Enum:1,2支持全量修改-1和增量修改-2，全量修改即按照修改数量修改库存；增量修改则按照输入的修改数量，增加或减少对应的数量。非必填默认全量修改
                    title: 修改类型
                  warehouse_id:
                    type: integer
                    title: 仓库ID
                    description: 不传入则用默认仓库承接
                x-apifox-orders:
                - sku_id
                - real_count
                - enable_count
                - inventory_type
                - warehouse_id
                required:
                - sku_id
                - enable_count
            example:
            - sku_id: 6802581821476
              real_count: 0
              enable_count: 0
              inventory_type: 1
              warehouse_id: 6167107555718
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  now:
                    type: string
                  data:
                    type: string
                required:
                - code
                - message
                - now
                - data
                x-apifox-orders:
                - code
                - message
                - now
                - data
              example:
                code: 200
                message: success
                now: '2025-03-06 14:49:42'
                data: success
          headers: {}
          x-apifox-name: 成功
      security: []
      x-apifox-folder: 库存
      x-apifox-status: released
      operationId: post_v1_product_push_inventory
      x-local-source-path: sources/pages/api-3478297.md
      x-source-id: api-3478297
      x-source-title: 库存写入
      x-source-module: 库存
  /v1/warehouse/list:
    get:
      summary: 仓库查询
      deprecated: false
      description: ''
      tags:
      - 库存
      parameters:
      - name: warehouse_id
        in: query
        description: 仓库ID查询条件
        required: false
        example: 1131355530
        schema:
          type: integer
      - name: warehouse_no
        in: query
        description: 仓库编号
        required: false
        example: WH001
        schema:
          type: string
      - name: authorization
        in: header
        description: ''
        required: true
        example: REDACTED_JWT
        schema:
          type: string
      - name: Authorization
        in: header
        description: 从/v1/oauth2/access_token获取到的access_token
        required: true
        example: '{{access_token}}'
        schema:
          type: string
          default: '{{access_token}}'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    description: 错误码
                    type: integer
                    x-apifox-mock: 0
                  message:
                    description: 错误信息
                    type: string
                    x-apifox-mock: success
                  now:
                    description: 当前时间
                    type: string
                    x-apifox-mock: '2022-01-01 00:00:00'
                  data:
                    description: 响应数据
                    type: object
                    properties:
                      count:
                        description: 仓库总数
                        type: integer
                      list:
                        description: 仓库列表
                        type: array
                        items:
                          type: object
                          properties:
                            warehouse_id:
                              description: 仓库ID
                              type: integer
                            warehouse_no:
                              description: 仓库编号
                              type: string
                            name:
                              description: 仓库名称
                              type: string
                            status:
                              description: 状态：1-启用，2-停用
                              type: integer
                            default_flag:
                              description: 默认仓库：1-是，2-否
                              type: integer
                            manager:
                              description: 负责人
                              type: string
                            contact:
                              description: 联系方式
                              type: string
                            address:
                              description: 仓库地址
                              type: string
                            remark:
                              description: 备注
                              type: string
                          x-apifox-orders:
                          - warehouse_id
                          - warehouse_no
                          - name
                          - status
                          - default_flag
                          - manager
                          - contact
                          - address
                          - remark
                    x-apifox-orders:
                    - count
                    - list
                x-apifox-orders:
                - code
                - message
                - now
                - data
