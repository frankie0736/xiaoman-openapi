paths:
  /v1/oauth2/access_token:
    post:
      summary: 鉴权接口
      deprecated: false
      description: "当使用client_credentials时可以参考下面传入，这种情况下不会有刷新token，可以在过期前重新再次请求一下即可，这种格式下请在请求body中写入如下JSON数据\n{\n    \"grant_type\"\
        :\"client_credentials\",\n    \"client_id\": \"xxx\",\n    \"client_secret\": \"xxxx\",\n    \"scope\": \"invoices\
        \ purchaseOrder\"\n}\n\n注意：\n1、不管是password 还是 client_credentials 返回的token都有有效期，一般为8小时，期间8小时内重新获取不会刷新token有效时间，区别于走client_credentials没有expires_in，refresh_token返回。\n\
        2、其中参数scope理解为我们每个模块都有一个scope值，申请token时带入，比如客户模块为company，若只需要对接客户的模块的话，只需要在scope参数填入company即可，这时token只能访问客户模块的API，其他模块API不允许访问，否则会提示无权限比如no\
        \ permission invoices scopes；但是若有其他模块需要，则需要在scope中增加对应模块的scope，比如订单和客户模块scope=company invoices 中间以空格隔开。每个模块的scope可以在下面参数说明中查到，也可以到模块下首个页面获得。"
      tags:
      - 授权登录
      parameters: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  description: 授权模式 password 或 client_credentials
                  example: password
                  type: string
                client_id:
                  description: 登录主账号：OKKI CRM → 进入企业管理 → 外部对接 → API对接获取client_id
                  example: efc1126d6
                  type: string
                client_secret:
                  description: 登录主账号：OKKI CRM → 进入企业管理 → 外部对接 → API对接获取client_secret
                  example: dcc2228f1
                  type: string
                username:
                  description: 小满的登录邮箱，当client_credentials时不用传
                  example: xxx@xiaoman.cn
                  type: string
                password:
                  description: 密码需要使用SHA 256加密，当client_credentials是不用传
                  example: password
                  type: string
                scope:
                  description: '授权访问的业务API列表，中间加半角空格分割，目前开放 product(产品) company(公司客户) lead(线索) opportunity(商机) invoices(订单、报价单、回款单)
                    user(用户列表) costInvoice(费用单) paymentInvoice(付款单) purchaseOrder(采购订单) warehouse(库存) capitalAccount(资金账户)
                    等业务模块 '
                  example: 'company product  invoices '
                  type: string
              required:
              - grant_type
              - client_id
              - client_secret
              - scope
            examples: {}
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  token_type:
                    type: string
                    description: Bearer
                  expires_in:
                    type: integer
                    description: 有效时间 默认值：28800
                  access_token:
                    type: string
                    description: 令牌Token
                  refresh_token:
                    type: string
                    description: 刷新令牌
                required:
                - token_type
                - expires_in
                - access_token
                - refresh_token
                x-apifox-orders:
                - token_type
                - expires_in
                - access_token
                - refresh_token
          headers: {}
          x-apifox-name: 成功
      security: []
      x-apifox-folder: 授权登录
      x-apifox-status: released
      operationId: post_v1_oauth2_access_token
      x-local-source-path: sources/pages/api-3473041.md
      x-source-id: api-3473041
