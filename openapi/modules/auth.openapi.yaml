  /v1/oauth2/refresh_token:
    post:
      summary: 刷新令牌接口
      deprecated: false
      description: ''
      tags:
      - 授权登录
      parameters: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  description: '授权模式，默认值: refresh_token'
                  example: refresh_token
                  type: string
                refresh_token:
                  description: 刷新令牌，从鉴权接口中获取到的refresh_token
                  example: ''
                  type: string
                client_id:
                  description: 客户端身份标识（平台发放）
                  example: ''
                  type: string
                client_secret:
                  description: 客户端密钥（平台发放）
                  example: ''
                  type: string
              required:
              - grant_type
              - refresh_token
              - client_id
              - client_secret
            examples: {}
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  token_type:
                    type: string
                    description: token类型，一般都是Bearer
                  expires_in:
                    type: integer
                    description: token的有效时间，单位是秒，例如首次申请的token有效时间是28800=8小时
                  access_token:
                    type: string
                    description: 访问令牌，访问数据API接口用
                  refresh_token:
                    type: string
                    description: 刷新令牌，用来刷新申请新的access_token
                required:
                - token_type
                - expires_in
                - access_token
                - refresh_token
                x-apifox-orders:
                - token_type
                - expires_in
                - access_token
                - refresh_token
              example:
                token_type: Bearer
                expires_in: 28800
                access_token: REDACTED_JWT
                refresh_token: 
          headers: {}
          x-apifox-name: 成功
        '400':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  error_description:
                    type: string
                  message:
                    type: string
                required:
                - error
                - error_description
                - message
                x-apifox-orders:
                - error
                - error_description
                - message
              example:
                error: invalid_client
                error_description: Client authentication failed
                message: Client authentication failed
          headers: {}
          x-apifox-name: 无效密钥
        x-400:刷新令牌无效:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  error_description:
                    type: string
                  hint:
                    type: string
                  message:
                    type: string
                required:
                - error
                - error_description
                - hint
                - message
                x-apifox-orders:
                - error
                - error_description
                - hint
                - message
              example:
                error: invalid_request
                error_description: The refresh token is invalid.
                hint: Token has been revoked
                message: The refresh token is invalid.
          headers: {}
          x-apifox-name: 刷新令牌无效
      security: []
      x-apifox-folder: 授权登录
      x-apifox-status: released
      operationId: post_v1_oauth2_refresh_token
      x-local-source-path: sources/pages/api-3483803.md
