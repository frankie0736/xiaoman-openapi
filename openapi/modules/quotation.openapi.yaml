                              type: integer
                              title: 报价单ID
                            quotation_no:
                              type: string
                              title: 报价单编号
                            lock_flag:
                              type: string
                              title: 是否上锁
                            can_unlock:
                              type: integer
                              title: 是否可以解锁
                              description: 0:不允许,1:允许
                            approval_status:
                              type: integer
                              title: 审批状态
                              description: 0:草稿,1:同意,2:拒绝,3:审批中,4:申请人撤销,5:系统撤回,6:跳过,7:转移
                            name:
                              type: string
                              title: 报价单名称
                            currency:
