openapi: 3.0.1
info:
  title: Xiaoman OpenAPI - 报价单 (unofficial)
  version: '2026-05-09'
  description: 'Unofficial module spec generated from public Xiaoman Open API documentation: 报价单.'
servers:
- url: https://api-sandbox.xiaoman.cn
  description: official documented server
tags:
- name: 报价单
  x-module-slug: quotation
paths:
  /v1/invoices/quotation/list:
    get:
      summary: 报价单列表
      deprecated: false
      description: ''
      tags:
      - 报价单
      parameters:
      - name: start_time
        in: query
        description: 时间查询范围：开始日期
        required: false
        schema:
          type: string
      - name: "end_time\t"
        in: query
        description: 时间查询范围：结束日期
        required: false
        schema:
          type: string
      - name: start_index
        in: query
        description: 第几页，默认 = 1
        required: false
        schema:
          type: number
      - name: count
        in: query
        description: 每页记录数，默认 = 10
        required: false
        schema:
          type: number
      - name: removed
        in: query
        description: 默认0，1表示查询已删除的数据列表
        required: false
        schema:
          type: number
      - name: approval
        in: query
        description: 默认0，1表示查询审批通过的数据列表
        required: false
        schema:
          type: number
      - name: status
        in: query
        description: '默认值: 0，设置对应的状态值可以查询相关状态的数据列表，支持以半角逗号分割的多个状态值'
        required: false
        schema:
          type: string
      - name: Authorization
        in: header
        description: 从/v1/oauth2/access_token获取到的access_token
        required: true
        example: '{{access_token}}'
        schema:
          type: string
          default: '{{access_token}}'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  message:
                    type: string
                  now:
                    type: string
                  data:
                    type: object
                    properties:
                      list:
                        type: array
