openapi: 3.0.1
info:
  title: Xiaoman OpenAPI - 采购订单 (unofficial)
  version: '2026-05-09'
  description: 'Unofficial module spec generated from public Xiaoman Open API documentation: 采购订单.'
servers:
- url: https://api-sandbox.xiaoman.cn
  description: official documented server
tags:
- name: 采购订单
  x-module-slug: purchase-order
paths:
  /v1/purchaseOrder/list:
    get:
      summary: 采购订单列表
      deprecated: false
      description: ''
      tags:
      - 采购订单
      parameters:
      - name: start_time
        in: query
        description: 创建/更新开始时间
        required: false
        schema:
          type: string
      - name: end_time
        in: query
        description: 创建/更新截止时间
        required: false
        schema:
          type: string
      - name: count
        in: query
        description: 每页数量，默认20
        required: false
        schema:
          type: integer
      - name: start_index
        in: query
        description: 页码，默认1
        required: false
        schema:
          type: integer
      - name: removed
        in: query
        description: '默认值: 0，设置=1时查询已删除的数据列表'
        required: false
        schema:
          type: integer
      - name: time_type
        in: query
        description: 默认值1， 1更新时间，2创建时间
        required: false
        schema:
          type: integer
      - name: status
        in: query
        description: 采购订单状态，值为/v1/purchaseOrder/fields/selector接口的状态ID
        required: false
        schema:
          type: integer
      - name: status_name
        in: query
        description: 采购订单状态名称
        required: false
        schema:
          type: string
      - name: Authorization
        in: header
        description: 从/v1/oauth2/access_token获取到的access_token
        required: true
        example: access_token
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    description: 错误码
                    type: integer
                    x-apifox-mock: 0
                  message:
                    description: 错误信息
                    type: string
                    x-apifox-mock: success
                  now:
                    description: 当前时间
                    type: string
                    x-apifox-mock: '2022-01-01 00:00:00'
                  data:
                    description: 响应数据
                    type: object
                    properties:
                      count:
                        description: 采购订单列表总数
                        type: integer
                      list:
                        description: 采购订单列表数据
                        type: array
                        items:
                          type: object
                          properties:
                            purchase_order_id:
                              description: 采购订单ID
                              type: integer
                            purchase_order_no:
                              description: 采购订单编号
                              type: string
                            status_info:
                              description: 采购状态
                              type: object
                              properties:
                                id:
                                  description: 状态ID
                                  type: integer
                                name:
                                  description: 状态名称
                                  type: string
                              x-apifox-orders:
                              - id
                              - name
                            inbound_status_info:
                              description: 入库状态
                              type: object
                              properties:
                                id:
                                  description: 状态ID
                                  type: integer
                                name:
                                  description: 状态名称
                                  type: string
                              x-apifox-orders:
                              - id
                              - name
                            handler_info:
                              description: 当前处理人信息
                              type: array
                              items:
                                type: object
                                properties:
                                  user_id:
                                    description: 处理人ID
                                    type: integer
                                  nickname:
                                    description: 处理人昵称
                                    type: string
                                x-apifox-orders:
                                - user_id
                                - nickname
                            supplier_info:
                              description: 供应商信息
                              type: object
                              properties:
                                supplier_id:
                                  description: 供应商ID
                                  type: integer
                                name:
                                  description: 供应商名称
                                  type: string
                              x-apifox-orders:
                              - supplier_id
                              - name
                            purchase_date:
                              description: 采购日期
                              type: string
                            delivery_date:
                              description: 交货日期
                              type: string
                            remark:
                              description: 备注
                              type: string
                            payment_status_info:
                              description: 付款状态
                              type: object
                              properties:
                                id:
                                  description: 状态ID
                                  type: integer
                                name:
                                  description: 状态名称
                                  type: string
                              x-apifox-orders:
                              - id
                              - name
                            create_time:
                              description: 创建时间
                              type: string
                            create_user_info:
                              description: 创建人信息
                              type: object
                              properties:
                                user_id:
                                  description: 创建人id
                                  type: integer
                                nickname:
                                  description: 创建人昵称
                                  type: string
                              x-apifox-orders:
                              - user_id
                              - nickname
                            update_user_info:
                              description: 更新人信息
                              type: object
                              properties:
                                user_id:
                                  description: 更新人id
                                  type: integer
                                nickname:
                                  description: 更新人昵称
                                  type: string
                              x-apifox-orders:
                              - user_id
                              - nickname
                            update_time:
                              description: 更新时间
                              type: string
                            addition_cost_amount:
                              type: number
                              description: 附加费用总金额
                            amount:
                              type: number
                              description: 采购订单金额
                            amount_rmb:
                              type: number
                              description: 采购订单金额(CNY)人民币
                            amount_usd:
                              type: number
                              description: 采购订单金额(USD)美元
                            exchange_rate:
                              type: number
                              description: 汇率(兑CNY人民币)
                            exchange_rate_usd:
                              type: number
                              description: 汇率(兑USD美元)
                            payment_amount:
                              type: number
                              description: 已付款金额
                            payment_amount_rmb:
                              type: number
                              description: 已付款金额(CNY)
                            payment_amount_usd:
                              type: number
                              description: 已付款金额(USD)
                            product_total_amount:
                              type: number
                              description: 产品总金额
                            product_total_amount_rmb:
                              type: number
                              description: 产品总金额(CNY)
                            product_total_amount_usd:
                              type: number
                              description: 产品总金额(USD)
                            product_total_count:
                              type: number
                              description: 产品总数量
                            product_total_count_no_parts:
                              type: number
                              description: 产品总数量（不含配件）
                            parts_total_count:
                              type: number
                              description: 配件产品总数量
                          x-apifox-orders:
                          - purchase_order_id
                          - purchase_order_no
                          - status_info
                          - inbound_status_info
                          - handler_info
                          - supplier_info
                          - purchase_date
                          - delivery_date
                          - remark
                          - payment_status_info
                          - create_time
                          - create_user_info
                          - update_user_info
                          - update_time
                          - addition_cost_amount
                          - amount
                          - amount_rmb
                          - amount_usd
                          - exchange_rate
                          - exchange_rate_usd
                          - payment_amount
                          - payment_amount_rmb
                          - payment_amount_usd
                          - product_total_amount
                          - product_total_amount_rmb
                          - product_total_amount_usd
                          - product_total_count
                          - product_total_count_no_parts
                          - parts_total_count
                    x-apifox-orders:
                    - count
                    - list
                x-apifox-orders:
                - code
                - message
                - now
                - data
