  /v1/company/pushCompanyAndCustomers:
    post:
      summary: 客户（含联系人）新增/编辑
      deprecated: false
      description: '| 异常码 | 异常消息 |异常解决方案|

        | --- | --- | --- |

        | 404 | Not Found Resource | 检查传入company_id是否有误 |

        | 404 | No Privilege | 检查传入user_id是否是私海客户的跟进人 |

        '
      tags:
      - 客户
      - s7.1
      parameters:
      - name: Authorization
        in: header
        description: ''
        required: true
        example: REDACTED_JWT
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                company_id:
                  type: integer
                  title: 公司客户ID
                  description: '编辑时需要设置

                    值来自于/v1/company/list接口'
                user_id:
                  type: integer
                  title: 跟进人
                  description: '不填则默认为创建人

                    值来自于/v1/user/list接口'
                batch_user_ids:
                  type: array
                  items:
                    type: integer
                  title: 批量新增跟进人
                  description: 'eg: [11, 22]

                    值来自于/v1/user/list接口'
                remove_user_id:
                  type: array
                  items:
                    type: integer
                  title: 删除跟进人
                  description: 'eg: [33, 44]

                    值来自于/v1/user/list接口'
                is_public:
                  type: integer
                  title: 客户类型
                  description: 私海客户is_public=0;公海客户is_public=1;默认is_public=0
                serial_id:
                  type: string
                  title: 客户编号
                  description: 可选字段,不设置默认生成
                name:
                  type: string
                  title: 公司名称
                short_name:
                  type: string
                  title: 公司简称
                country:
                  type: string
                  title: 国家/地区
                  description: 非必填,ISO两位码
                province:
                  type: string
                  title: 省
                  description: 对接需要询问对接协助开发获取省枚举
                city:
                  type: string
                  title: 市
                  description: 对接需要询问对接协助开发获取市枚举
                tel_area_code:
                  type: string
                  title: 座机区号
                tel:
                  type: string
                  title: 座机号码
                fax:
                  type: string
                  title: 传真
                group_id:
                  type: integer
                  title: 客户分组
                  description: 可选字段,从分组v1/company/fields/selector?field=group_id选择
                pool_id:
                  type: integer
                  title: 客户公海分组
                  description: 必填,不确定可设置为0,代表未分组，从v1/company/fields/selector?field=pool_id选择
                trail_status:
                  type: integer
                  title: 客户阶段
                  description: 可选字段,从v1/company/fields/selector?field=trail_status选择
                biz_type:
                  type: integer
                  title: 客户类型 值来自于/v1/company/companyEnums 接口
                  description: '可选字段

                    值来自/v1/company/companyEnums接口'
                cus_tag:
                  type: array
                  items:
                    type: integer
                  title: 客户标签 值来自于/v1/company/companyEnums 接口
                  description: '非必填

                    值来自/v1/company/companyEnums接口'
                address:
                  type: string
                  title: 客户地址
                  description: 可选字段
                remark:
                  type: string
                  title: 备注
                  description: 可选字段
                homepage:
                  type: string
                  title: 公司主页网址
                  description: 可选字段
                star:
                  type: integer
                  title: 客户星级
                  description: 可选字段，1-5之间
                intention_level:
                  type: integer
                  title: 采购意向
                  description: 0未知，1低，2中，3高
                annual_procurement:
                  type: integer
                  title: 年采购额
                  description: "0: 无采购额  \n1: 0~1千美元  \n2: 1千～5千美元  \n3: 5千～1万美元  \n4: 1万～3万美元  \n5: 3万～5万美元  \n6: 5万～10万美元\
                    \  \n7: 10万～30万美元  \n8: 30万～50万美元  \n9: 50万～100万美元  \n10: 100万～500万美元  \n11: 500万美元以上  "
                timezone:
                  type: integer
                  title: 时区 值来自于/v1/company/companyEnums 接口
                  description: 非必填
                scale_id:
                  type: integer
                  title: 规模 值来自于/v1/company/companyEnums 接口
                  description: '1：少于59人,2：60-149人,3：150-499人,4：500-999人,5：1000-4999人，6: 5000人以上'
                image_list:
                  type: array
                  items:
                    type: string
                  title: 公司logo
                  description: '非必填，example: [''xx1'', ''xx2''], 需要传可访问的URL'
                next_follow_up_time:
                  type: string
                  title: 下次跟进时间
                  description: 非必填
                category_ids:
                  type: array
                  items:
                    type: array
                    items:
                      type: integer
                  title: 主营产品
                  description: '非必填，example: [[1, 2, 3], [4, 5, 6]]'
                product_group_ids:
                  type: array
                  items:
                    type: integer
                  title: 产品分组
                  description: '非必填，example: [1, 2]'
                customers:
                  type: array
                  items:
                    type: object
                    properties:
                      customer_id:
                        type: integer
                        title: 客户联系人ID
                        description: 编辑时需要设置
                      name:
                        type: string
                        title: 昵称
                      email:
                        type: string
                        title: 联系人邮箱
                      tel:
                        type: string
                        title: 电话号码
                      tel_area_code:
                        type: string
                        title: 电话号码区号
                      post_grade:
                        type: integer
                        title: 职级
                      post:
                        type: string
                        title: 职位
