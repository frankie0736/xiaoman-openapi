                        type: string
                        title: WhatsApp账号
                      facebook:
                        type: string
                        title: Facebook账号
                      wechat:
                        type: string
                        title: 微信账号
                      twitter:
                        type: string
                        title: Twitter账号
                      birth:
                        type: string
                        title: 生日
                      gender:
                        type: integer
                        title: 性别
                        description: 1男，2女
                      remark:
                        type: string
                        title: 联系人备注
