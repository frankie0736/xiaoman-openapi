      parameters:
      - name: count
        in: query
        description: 每页数量
        required: false
        example: 20
        schema:
          type: integer
      - name: start_index
        in: query
        description: 页码
        required: false
        example: 1
        schema:
          type: integer
      - name: removed
        in: query
        description: 默认值:0，设置=1时查询已删除的数据列表
        required: false
        example: '0'
        schema:
          type: string
      - name: all
        in: query
        description: 默认值:1，设置=1查询所有客户，设置=0只查询私海客户，设置=2查询公海客户
        required: false
        example: '1'
        schema:
          type: string
      - name: group_id
        in: query
        description: "设置客户分组ID后，只查询对应分组的客户 \n传入值来自/v1/company/fields/selector?field=group_id返回值data中的id"
        required: false
        example: 1
        schema:
          type: integer
      - name: start_time
        in: query
        description: 开始时间，YYYY-MM-DD
        required: false
        example: '2022-09-21 21:50:00'
        schema:
          type: string
      - name: end_time
        in: query
        description: 结束时间，YYYY-MM-DD
        required: false
        example: '2022-09-23 21:50:00'
        schema:
          type: string
      - name: time_type
        in: query
        description: 控制start_time，end_time查询什么时间字段，默认值=1，1 更新时间 , 2 创建时间, 3 建档时间
        required: false
        example: '1'
        schema:
          type: string
      - name: Authorization
        in: header
        description: 从/v1/oauth2/access_token获取到的access_token
        required: true
        example: '{{access_token}}'
        schema:
          type: string
          default: '{{access_token}}'
